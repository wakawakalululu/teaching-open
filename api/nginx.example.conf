server
{
    listen 80;
    server_name localhost;  #改成你的域名

    # ===== 安全加固(V2.6)：安全响应头 =====
    # 注意：location 块内一旦出现 add_header，将不再继承 server 级别的 add_header，
    # 因此下面每个 location 都重复声明了一份，修改时需同步。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP 需按站点实际使用的资源域名收敛；此处给出可直接上线的保守基线，
    # 已放行编辑器(Scratch/Blockly)所需的 blob: 与 data:。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'" always;
    # 关闭不需要的浏览器能力
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ===== 安全加固(V2.6)：隐藏版本信息 =====
    server_tokens off;

    # ===== 安全加固(V2.6)：禁止下载源码映射与敏感文件 =====
    location ~* \.(map|sql|bak|swp|log)$ {
        deny all;
        return 404;
    }

    location / {
      index index.html index.htm;
      root /www/wwwroot/localhost;  #网站前端位置

      if (!-e $request_filename) {
          rewrite ^(.*)$ /index.html?s=$1 last;
          break;
      }

      gzip on;
      gzip_min_length 1k;
      gzip_comp_level 9;
      gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
      gzip_vary on;
      gzip_disable "MSIE [1-6]\.";
    }

  location ^~ /api
  {
      expires 0;
      proxy_pass              http://127.0.0.1:8080/api/;
      proxy_set_header        Host 127.0.0.1;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        domain $host;

      # ===== 安全加固(V2.6)：后端管理端点不在网关层暴露 =====
      # 即使后端误开 Swagger/Druid/Actuator，也不让外部经 /api 访问到。
      location ~ ^/api/(druid|swagger-ui\.html|swagger-resources|v2/api-docs|v3/api-docs|doc\.html|actuator)/ {
          deny all;
          return 404;
      }

      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Permitted-Cross-Domain-Policies "none" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

      add_header X-Cache $upstream_cache_status;
  	  add_header Cache-Control no-cache;
  }
}
